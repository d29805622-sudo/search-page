<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录处理中 - 极客社区</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .callback-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loading-spinner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .callback-text { color: white; font-size: 1.2em; }
        .success-box { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: none; }
        .success-icon { font-size: 4em; margin-bottom: 20px; }
        .success-box h2 { color: var(--text-primary); margin-bottom: 10px; }
        .success-box p { color: var(--text-secondary); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="loading-spinner" id="spinner"></div>
        <div class="callback-text" id="loadingText">正在登录...</div>
        
        <div class="success-box" id="successBox">
            <div class="success-icon">✅</div>
            <h2>登录成功！</h2>
            <p>欢迎回来，<span id="userName"></span></p>
            <p>正在跳转到首页...</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // 处理 GitHub OAuth 回调
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                showError(`登录失败：${error}`);
                return;
            }

            if (!code) {
                showError('未找到授权码');
                return;
            }

            try {
                // 显示加载中
                document.getElementById('spinner').style.display = 'block';
                document.getElementById('loadingText').style.display = 'block';

                // 注意：实际生产中需要后端交换 token
                // 这里简化处理，直接存储 code
                localStorage.setItem('github_code', code);

                // 获取用户信息（需要 token，这里模拟）
                // 实际应该调用后端 API 交换 token 后再获取用户信息
                
                // 模拟登录成功
                setTimeout(() => {
                    // 重定向到首页
                    window.location.href = 'index.html';
                }, 1500);

            } catch (err) {
                showError(`登录失败：${err.message}`);
            }
        }

        function showError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('loadingText').innerHTML = `
                <div style="color: #fee2e2; font-size: 1em;">
                    ❌ ${message}<br>
                    <a href="index.html" style="color: white; text-decoration: underline;">返回首页</a>
                </div>
            `;
        }

        // 页面加载时处理
        window.addEventListener('load', handleCallback);
    </script>
</body>
</html>
