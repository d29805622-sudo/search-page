<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - 极客社区</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .post-detail { background: white; border-radius: 12px; padding: 40px; box-shadow: var(--shadow-lg); margin-bottom: 30px; }
        .post-header { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px solid var(--border); }
        .post-title { font-size: 2em; margin-bottom: 15px; }
        .post-meta { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .post-author { display: flex; align-items: center; gap: 10px; }
        .post-author img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .post-author-info { display: flex; flex-direction: column; }
        .author-name { font-weight: 600; }
        .post-time { color: var(--text-light); font-size: 0.9em; }
        .post-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { padding: 5px 12px; background: var(--bg-secondary); border-radius: 20px; font-size: 0.85em; }
        .tag.category { background: #dbeafe; color: #2563eb; }
        .post-content { line-height: 1.8; font-size: 1.05em; }
        .post-content p { margin-bottom: 15px; }
        .post-content pre { background: var(--bg-dark); color: #e5e7eb; padding: 20px; border-radius: 8px; overflow: auto; margin: 20px 0; }
        .post-content code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .post-content pre code { background: none; padding: 0; }
        .post-actions { display: flex; gap: 15px; margin-top: 30px; padding-top: 25px; border-top: 2px solid var(--border); }
        .action-btn { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--bg-secondary); border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .action-btn:hover { background: var(--border); transform: translateY(-2px); }
        .comments-section { background: white; border-radius: 12px; padding: 40px; box-shadow: var(--shadow-lg); }
        .comments-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        .comments-header h2 { font-size: 1.5em; }
        .comment { padding: 20px 0; border-bottom: 1px solid var(--border); }
        .comment:last-child { border-bottom: none; }
        .comment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .comment-author img { width: 35px; height: 35px; border-radius: 50%; }
        .comment-content { margin-left: 45px; line-height: 1.7; }
        .comment-form { margin-top: 30px; }
        .comment-form textarea { width: 100%; min-height: 120px; padding: 15px; border: 2px solid var(--border); border-radius: 8px; resize: vertical; outline: none; font-family: inherit; font-size: 14px; }
        .comment-form textarea:focus { border-color: var(--primary); }
        .comment-form button { margin-top: 15px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        @media (max-width: 768px) { .post-detail, .comments-section { padding: 25px 20px; } .post-title { font-size: 1.5em; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">💬</span>
                <span class="logo-text">极客社区</span>
            </a>
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="resources.html">资源</a>
                <a href="articles.html">文章</a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <a href="../index.html" class="back-link">← 返回首页</a>

        <!-- 帖子详情 -->
        <div class="post-detail">
            <div class="post-header">
                <h1 class="post-title" id="postTitle">加载中...</h1>
                <div class="post-meta">
                    <div class="post-author">
                        <img src="" alt="" id="postAuthorAvatar">
                        <div class="post-author-info">
                            <span class="author-name" id="postAuthor">...</span>
                            <span class="post-time" id="postTime">...</span>
                        </div>
                    </div>
                    <div class="post-tags" id="postTags"></div>
                </div>
            </div>
            <div class="post-content" id="postContent">
                加载中...
            </div>
            <div class="post-actions">
                <button class="action-btn" onclick="likePost()">👍 点赞 <span id="likeCount">0</span></button>
                <button class="action-btn" onclick="bookmarkPost()">🔖 收藏</button>
                <button class="action-btn" onclick="sharePost()">📤 分享</button>
                <button class="action-btn" onclick="reportPost()">⚠️ 举报</button>
            </div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <div class="comments-header">
                <h2>💬 评论 (<span id="commentCount">0</span>)</h2>
            </div>
            
            <div id="commentsList">
                <div class="loading">评论加载中...</div>
            </div>

            <div class="comment-form" id="commentForm" style="display: none;">
                <textarea id="commentInput" placeholder="写下你的评论..."></textarea>
                <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/github.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const issueNumber = urlParams.get('number');
        let issueData = null;

        // 加载帖子
        async function loadPost() {
            if (!issueNumber) {
                document.getElementById('postTitle').textContent = '帖子不存在';
                return;
            }

            try {
                const issue = await GitHubAPI.getIssue(issueNumber);
                issueData = issue;
                
                document.getElementById('postTitle').textContent = issue.title;
                document.getElementById('postAuthor').textContent = issue.user.login;
                document.getElementById('postAuthorAvatar').src = issue.user.avatar_url;
                document.getElementById('postTime').textContent = formatTime(issue.created_at);
                document.getElementById('postContent').innerHTML = marked.parse(issue.body || '');
                document.getElementById('likeCount').textContent = issue.reactions?.+1 || 0;
                document.getElementById('commentCount').textContent = issue.comments;
                
                const tags = issue.labels.map(label => 
                    `<span class="tag ${['tech','question','share','project','career'].includes(label.name) ? 'category' : ''}">${label.name}</span>`
                ).join('');
                document.getElementById('postTags').innerHTML = tags;

                loadComments(issue.number);
                checkLogin();
            } catch (error) {
                document.getElementById('postContent').innerHTML = `<p style="color: var(--error);">加载失败：${error.message}</p>`;
            }
        }

        // 加载评论
        async function loadComments(issueNumber) {
            try {
                const comments = await GitHubAPI.getComments(issueNumber);
                const container = document.getElementById('commentsList');
                
                if (comments.length === 0) {
                    container.innerHTML = '<div class="loading">暂无评论，快来抢沙发！</div>';
                    return;
                }
                
                container.innerHTML = comments.map(comment => `
                    <div class="comment">
                        <div class="comment-header">
                            <img src="${comment.user.avatar_url}" alt="${comment.user.login}">
                            <span class="author-name">${comment.user.login}</span>
                            <span class="post-time">${formatTime(comment.created_at)}</span>
                        </div>
                        <div class="comment-content">${marked.parse(comment.body)}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Load comments error:', error);
            }
        }

        // 检查登录
        function checkLogin() {
            const user = localStorage.getItem('github_user');
            if (user) {
                document.getElementById('commentForm').style.display = 'block';
            }
        }

        // 发表评论
        function submitComment() {
            const content = document.getElementById('commentInput').value.trim();
            if (!content) return alert('请输入评论内容');
            
            alert('✓ 评论已提交！');
            document.getElementById('commentInput').value = '';
        }

        // 点赞
        function likePost() {
            alert('👍 已点赞！');
        }

        // 收藏
        function bookmarkPost() {
            alert('🔖 已收藏！');
        }

        // 分享
        function sharePost() {
            if (navigator.share) {
                navigator.share({
                    title: issueData?.title,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('📤 链接已复制到剪贴板！');
            }
        }

        // 举报
        function reportPost() {
            const reason = prompt('请输入举报原因：');
            if (reason) {
                alert('⚠️ 举报已提交，我们会尽快处理！');
            }
        }

        // 工具函数
        function formatTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        // Markdown 解析（简单版）
        const marked = {
            parse: (text) => {
                if (!text) return '';
                return text
                    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
            }
        };

        loadPost();
    </script>
</body>
</html>
