<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - 极客社区</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .page-header p { color: var(--text-secondary); }
        .form-card { background: white; padding: 40px; border-radius: 12px; box-shadow: var(--shadow-lg); }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px;
            font-size: 15px; outline: none; transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .form-group textarea { min-height: 300px; resize: vertical; }
        .form-group small { display: block; margin-top: 5px; color: var(--text-light); font-size: 0.85em; }
        .form-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px; }
        .btn { padding: 12px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-block; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .login-required { text-align: center; padding: 60px 20px; }
        .login-required h2 { margin-bottom: 20px; }
        @media (max-width: 768px) { .form-card { padding: 25px 20px; } .form-actions { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">💬</span>
                <span class="logo-text">极客社区</span>
            </a>
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="resources.html">资源</a>
                <a href="articles.html">文章</a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <a href="../index.html" class="back-link">← 返回首页</a>
        
        <div class="page-header">
            <h1>📝 发布新帖</h1>
            <p>分享你的问题、经验或资源</p>
        </div>

        <div id="loginRequired" class="login-required" style="display: none;">
            <h2>🔐 需要登录</h2>
            <p>请先登录 GitHub 账号后发帖</p>
            <button class="btn btn-primary" onclick="login()" style="margin-top: 20px;">GitHub 登录</button>
        </div>

        <form id="postForm" class="form-card" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>标题 *</label>
                <input type="text" name="title" required placeholder="简洁明了的标题，让别人一眼看懂你的问题">
                <small>标题限制在 100 字以内</small>
            </div>

            <div class="form-group">
                <label>分类 *</label>
                <select name="category" required>
                    <option value="">选择分类</option>
                    <option value="tech">💻 技术讨论</option>
                    <option value="question">❓ 问答求助</option>
                    <option value="share">📦 资源分享</option>
                    <option value="project">🚀 项目展示</option>
                    <option value="career">💼 职业发展</option>
                </select>
            </div>

            <div class="form-group">
                <label>标签</label>
                <input type="text" name="tags" placeholder="JavaScript, React, 前端... 用逗号分隔">
                <small>最多 5 个标签，帮助更多人找到你的帖子</small>
            </div>

            <div class="form-group">
                <label>内容 *</label>
                <textarea name="content" required placeholder="详细描述你的问题或分享内容...

支持 Markdown 格式：
- **粗体**
- [链接](url)
- `代码`
- ``` 代码块 ```"></textarea>
                <small>内容限制在 10000 字以内</small>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">取消</button>
                <button type="submit" class="btn btn-primary">发布帖子</button>
            </div>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/github.js"></script>
    <script>
        // 检查登录
        const user = localStorage.getItem('github_user');
        if (!user) {
            document.getElementById('postForm').style.display = 'none';
            document.getElementById('loginRequired').style.display = 'block';
        }

        function login() {
            const clientId = 'Ov23liGqfhGvY8pUMZ3L';
            const redirectUri = encodeURIComponent(window.location.origin + '/community/callback.html');
            window.location.href = `https://github.com/login/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&scope=public_repo`;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const title = formData.get('title');
            const category = formData.get('category');
            const tags = formData.get('tags').split(',').map(t => t.trim()).filter(t => t);
            const content = formData.get('content');

            // 构建内容（Markdown 格式）
            const body = `
## 内容

${content}

---
*此帖子由 [极客社区](https://d29805622-sudo.github.io/community/) 自动发布*
`.trim();

            const labels = [category, ...tags].filter(Boolean);

            alert('✓ 帖子发布成功！\n\n正在跳转到帖子页面...');
            
            // 模拟跳转（实际需要调用 API）
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 1500);
        }
    </script>
</body>
</html>
