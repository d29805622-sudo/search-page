<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极客社区 - 开发者的技术交流平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">💬</span>
                <span class="logo-text">极客社区</span>
            </a>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="搜索帖子、标签、用户...">
                <button onclick="search()">🔍</button>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="pages/categories.html">分类</a>
                <a href="pages/resources.html">资源</a>
                <a href="pages/articles.html">文章</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-primary" onclick="login()" id="loginBtn">登录</button>
                <a href="pages/create.html" class="btn btn-accent" id="createBtn" style="display:none;">发帖</a>
                <div class="user-menu" id="userMenu" style="display:none;">
                    <img src="" alt="" id="userAvatar">
                    <span id="userName"></span>
                </div>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container main-content">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="card">
                <h3>📊 社区统计</h3>
                <div class="stats-list">
                    <div class="stat-item">
                        <span class="stat-label">帖子</span>
                        <span class="stat-value" id="totalPosts">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">用户</span>
                        <span class="stat-value" id="totalUsers">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">评论</span>
                        <span class="stat-value" id="totalComments">0</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>🏷️ 热门标签</h3>
                <div class="tags-cloud" id="hotTags">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="card">
                <h3>📜 社区公告</h3>
                <div class="announcement">
                    <p>🎉 欢迎来到极客社区！</p>
                    <p>✅ 自由交流技术</p>
                    <p>✅ 分享开源项目</p>
                    <p>✅ 互助解决问题</p>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <div class="content">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-tabs">
                    <button class="tab-btn active" onclick="filterPosts('all')">全部</button>
                    <button class="tab-btn" onclick="filterPosts('hot')">热门</button>
                    <button class="tab-btn" onclick="filterPosts('new')">最新</button>
                    <button class="tab-btn" onclick="filterPosts('solved')">已解决</button>
                </div>
                <div class="filter-actions">
                    <select id="categoryFilter" onchange="filterByCategory()">
                        <option value="">所有分类</option>
                        <option value="tech">技术讨论</option>
                        <option value="question">问答求助</option>
                        <option value="share">资源分享</option>
                        <option value="project">项目展示</option>
                        <option value="career">职业发展</option>
                    </select>
                </div>
            </div>

            <!-- 帖子列表 -->
            <div class="posts-list" id="postsList">
                <!-- 动态生成 -->
                <div class="loading">加载中...</div>
            </div>

            <!-- 加载更多 -->
            <div class="load-more">
                <button class="btn btn-secondary" onclick="loadMore()">加载更多</button>
            </div>
        </div>

        <!-- 右侧边栏 -->
        <aside class="sidebar right-sidebar">
            <div class="card">
                <h3>🔥 热门帖子</h3>
                <div class="hot-posts" id="hotPosts">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="card">
                <h3>👥 活跃用户</h3>
                <div class="active-users" id="activeUsers">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="card">
                <h3>📅 最近活动</h3>
                <div class="recent-activity" id="recentActivity">
                    <!-- 动态生成 -->
                </div>
            </div>
        </aside>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 极客社区 - 开发者的技术交流平台</p>
            <p class="footer-links">
                <a href="#">关于我们</a>
                <a href="#">社区规范</a>
                <a href="#">隐私政策</a>
                <a href="#">联系方式</a>
            </p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/github.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
