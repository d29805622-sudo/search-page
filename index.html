<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧛‍♂️小魔头Galgame资源论坛🧩</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="main-container">
        <header class="header">
            <div class="logo">🧛‍♂️ 小魔头 Galgame 资源论坛 🧩</div>
            <nav class="nav">
                <a href="#" class="nav-item active" data-page="home">首页</a>
                <a href="#" class="nav-item" data-page="xiaomogui">小魔头</a>
                <a href="#" class="nav-item" data-page="ggame">G游戏</a>
                <a href="#" class="nav-item" data-page="upload">上传游戏包</a>
                <a href="#" class="nav-item" data-page="login" id="loginBtn">登录/注册</a>
            </nav>
            <div class="user-info" id="userInfo" style="display:none;">
                <span id="usernameDisplay"></span>
                <span id="userRole"></span>
                <button onclick="logout()" class="btn-logout">退出</button>
            </div>
        </header>
        <div class="banner">
            <h1>动漫交流 | Galgame游戏包 | 同人</h1>
            <p class="subtitle">🌟 下载游戏包无需登录 | 上传游戏包需管理员审核 🌟</p>
        </div>
        <div class="categories" id="categories"></div>
        <main class="content">
            <section id="page-home" class="page active">
                <h2 class="section-title">🎮 精选游戏包 🎮</h2>
                <div class="posts-grid" id="homePosts"></div>
            </section>
            <section id="page-category" class="page">
                <div class="category-header">
                    <h2 id="categoryTitle">分类名称</h2>
                    <button class="btn-primary" onclick="showPostEditor()" id="newPostBtn" style="display:none;">发布帖子</button>
                </div>
                <div class="posts-list" id="categoryPosts"></div>
            </section>
            <section id="page-post" class="page">
                <div class="post-detail" id="postDetail"></div>
                <div class="comments-section">
                    <h3>💬 评论</h3>
                    <div class="comment-form" id="commentForm" style="display:none;">
                        <textarea id="commentContent" placeholder="写下你的评论..."></textarea>
                        <button onclick="submitComment()" class="btn-primary">发表评论</button>
                    </div>
                    <div class="comments-list" id="commentsList"></div>
                </div>
            </section>
            <section id="page-editor" class="page">
                <div class="editor-container">
                    <h2>📝 发布帖子</h2>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="postCate"></select>
                    </div>
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="postTitle" placeholder="请输入帖子标题">
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="postContent" placeholder="请输入帖子内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label>上传游戏包（可选）</label>
                        <input type="file" id="postFile">
                        <small>支持 ZIP/RAR/7Z 格式，最大 500MB</small>
                    </div>
                    <div class="form-actions">
                        <button onclick="submitPost()" class="btn-primary">发布帖子</button>
                        <button onclick="cancelPost()" class="btn-secondary">取消</button>
                    </div>
                </div>
            </section>
            <section id="page-login" class="page">
                <div class="auth-container">
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login">登录</button>
                        <button class="auth-tab" data-tab="register">注册</button>
                    </div>
                    <div class="auth-form" id="loginForm">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="loginUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" id="loginPassword" placeholder="请输入密码">
                        </div>
                        <button onclick="login()" class="btn-primary btn-full">登录</button>
                    </div>
                    <div class="auth-form" id="registerForm" style="display:none;">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="regUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" id="regPassword" placeholder="请输入密码">
                        </div>
                        <div class="form-group">
                            <label>昵称</label>
                            <input type="text" id="regNickname" placeholder="请输入昵称">
                        </div>
                        <button onclick="register()" class="btn-primary btn-full">注册</button>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>© 2025 小魔头Galgame资源论坛 - 动漫交流 | Galgame游戏包 | 同人</p>
            <p>上传游戏包需管理员审核 | 下载游戏包无需登录</p>
        </footer>
    </div>
    <div class="toast" id="toast"></div>
    <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3>🔧 管理员面板</h3>
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="pending">待审核帖子</button>
            <button class="admin-tab" data-tab="users">用户管理</button>
        </div>
        <div class="admin-content" id="adminContent"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
